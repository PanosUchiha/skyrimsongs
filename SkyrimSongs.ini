; SkyrimSongs settings. Most can be changed in game with SKSE Menu Framework (Mod Control Panel > Skyrim Songs).

[Play]
Hotkey = 0x18            ; take out your instrument / put it away. DirectInput scan code: 0x18 = O
RequireInstrument = 1    ; you need a lute or flute in your pack (0: play without one)
ThirdPerson = 1          ; switch to third person while you play, and back after
MuteGameMusic = 1        ; quiet the game's music while you play
MusicCategory = Music    ; the sound category the game's music is in (its name in Settings > Audio; translate it if your game isn't in English)
Volume = 0.90            ; the instruments (0 - 2)
Reverb = 0.16            ; room echo (0 - 1)
LatencyMs = 0            ; play along: if your notes are judged late, raise this (milliseconds)
Speed = 1.00             ; play along: song speed (0.5 - 1.0)
UiScale = 1.00
ShowKeyboard = 1         ; the key guide at the bottom of the screen

[Crowd]
ListenRange = 1500       ; how far you can be heard (game units; 70 is about a metre)
TipRate = 1.00           ; how often happy listeners tip
TipSize = 1.00           ; how much they give
MaxTipPerListener = 40   ; most one person gives you in one performance
Patience = 1.00          ; how quickly a bad set turns the room (higher = quicker)
ThrowOut = 1             ; a hostile crowd in an inn gets you thrown out, and you can't play there again that day
SpeechXP = 0.50          ; Speech experience per septim earned

[Animation]
; the idles played while you perform (their editor IDs)
LuteIdle = IdleLuteStart
FluteIdle = IdleFluteStart
StopIdle = IdlePlayerStop

[Debug]
LogInput = 0
